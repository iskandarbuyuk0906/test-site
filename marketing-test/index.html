border:1px solid #f3d995;color:var(--amber);font-size:12px;padding:9px 12px;border-radius:10px;margin:12px 0}.qfooter{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.qfooter .right{display:flex;gap:9px}.rail{position:sticky;top:16px;display:grid;gap:14px}.railcard{background:#fff;border-radius:17px;border:1px solid var(--line);padding:19px;box-shadow:var(--shadow)}.railcard h3{margin:0 0 14px;font-size:16px}.rowline{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}.rowline strong{color:#27324a}.progress{height:9px;border-radius:100px;background:#edf0f6;overflow:hidden;margin:11px 0 8px}.progress>div{height:100%;background:var(--accent);border-radius:100px;transition:width .25s}.palette{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-height:310px;overflow:auto}.pbutton{border:1px solid #dce2ec;background:#f9fafd;color:#5b6883;min-width:0;padding:7px 0;border-radius:7px;font-size:11px;font-weight:800}.pbutton.now{outline:2px solid var(--accent);outline-offset:1px}.pbutton.pass{background:var(--greenbg);color:var(--green);border-color:#95d8b2}.pbutton.fail{background:var(--redbg);color:var(--red);border-color:#f2b3bd}.legend{display:flex;gap:11px;font-size:11px;flex-wrap:wrap;margin-top:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:100px;display:inline-block;margin-right:4px}.smallaction{font-size:12px;padding:8px 11px;border-radius:9px}.panelbottom{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}

const RAW=[[1,"Turistik mahsulotga berilgan to’g’ri ta’rifni belgilang?","Turizm korxonasi foydasi","Faqat mehmonxona binosi","Turist uchun xizmatlar majmui","Faqat sayohat sug‘urtasi","C","M1, 7-slayd","Turistik mahsulot — turist ehtiyojini qondirish uchun shakllantirilgan xizmatlar majmui.","Tayyor"],[2,"Turizmda Raqamli marketing nima?","Faqat sayyohlik yarmarkasi","Faqat gazeta orqali reklama","Faqat telefon orqali bronlash","Raqamli kanallar orqali targ‘ib va sotish","D","M10, 10-slayd","Raqamli marketing — turistik mahsulotni internet va boshqa raqamli kanallar yordamida tanitish, mijoz jalb qilish hamda sotish faoliyati.","Tayyor"],[6,"Turizm mahsulotlarida qiymat yaratish deganda nima tushuniladi?","Reklamasiz xizmat ko‘rsatish","Faqat narxni qimmatlashtirish","Turist oladigan foyda va tajribani oshirish","Xizmat turlarini kamaytirish","C","M2, 3-slayd","Qiymat yaratish — turist oladigan foyda va taassurotlarni uning pul, vaqt va kuch sarfiga nisbatan oshirishdir.","Tayyor"],[7,"Turizm mahsulotining qiymatini oshirishda qaysi omil muhim hisoblanadi?","Xodimlarni qisqartirish","Faqat reklama sonini ko‘paytirish","Sifatli, ehtiyojga mos xizmat va noyob tajriba","Tur dasturini bir xil saqlash","C","M2, 4-slayd","Turistik mahsulot qiymatini oshirishda mijoz ehtiyojiga mos sifatli xizmat va noyob tajriba yaratish muhim.","Tayyor"],[8,"Turistik bozorni segmentlash qanday turkumlanadi?","Faqat davlat va xususiy bo‘yicha","Faqat mehmonxona yulduziga qarab","Faqat narx va mavsum bo‘yicha","Geografik, demografik, psixografik va xulqiy","D","M11, 5-slayd","Bozor segmentatsiyasi odatda geografik (hudud), demografik (yosh, jins, oila), ijtimoiy-iqtisodiy (daromad, kasb), psixografik (qiziqish, hayot tarzi) va xulq-atvorga oid (sayohat…","Tayyor"],[9,"Turizm bozorini segmentlashning asosiy maqsadi nima?","Raqobatchilarni bozordan chiqarish","Barcha mijozga bir xil taklif berish","O‘xshash ehtiyojli mijozlarni ajratish","Faqat xizmat narxini ko‘tarish","C","M11, 4-slayd","Segmentlashning asosiy maqsadi — ehtiyoji o‘xshash turistlar guruhlarini aniqlab, ularga mos mahsulot va marketing taklifini ishlab chiqish.","Tayyor"],[10,"4P- marketing kompleksiga qaysi elementlar kiradi?","Narx, soliq, kredit, foyda","Reklama, sug‘urta, bojxona, viza","Mahsulot, narx, joy, ilgari surish","Xodim, jarayon, muhit, foyda","C","M1, 9-slayd","4P marketing kompleksi: Product — mahsulot va uning sifati; Price — narx; Place — sotish joyi va tarqatish kanallari; Promotion — reklama va ilgari surish.","Tayyor"],[13,"Turizm bozorida maqsadli marketing nima?","Faqat umumiy narxni pasaytirish","Tanlangan segmentga mos taklif yaratish","Talabni o‘rganmasdan sotish","Barcha xaridorni bir guruh deyish","B","M11, 4-slayd","Maqsadli marketing — bozorni segmentlarga ajratib, jozibali bir yoki bir necha guruhni tanlash hamda aynan shu turistlarga mos mahsulot, narx va reklama yaratishdir.","Tayyor"],[14,"Bozor segmentiga berilgan to’g’ri ta’rifni belgilang?","Bitta turagentlikning ishchilari","Bir hududdagi barcha korxonalar","Ehtiyoji va xulqi o‘xshash mijozlar guruhi","Faqat bir xil narxdagi xizmatlar","C","M11, 4-slayd","Bozor segmenti — ehtiyojlari, xususiyatlari yoki xarid xulqi o‘xshash bo‘lgan iste’molchilar guruhi.","Tayyor"],[15,"PESTEL tahlilida qaysi omillar tahlil qilinadi?","Siyosiy, iqtisodiy, ijtimoiy, texnologik, ekologik, huquqiy","Faqat xodim, vaqt va material","Faqat narx, foyda va reklama","Faqat brend, sifat va servis","A","M12, 7-slayd","PESTEL tahlili oltita tashqi muhit omilini o‘rganadi: Political — siyosiy; Economic — iqtisodiy; Social — ijtimoiy; Technological — texnologik; Environmental — ekologik; Legal — huquqiy.","Tayyor"],[16,"Turizmda segmentlashning asosiy belgilari –bu?","Faqat texnik va ishlab chiqarish","Faqat soliqqa oid va huquqiy","Geografik, demografik, psixografik, xulqiy","Faqat narx va reklama kanali","C","M11, 5-slayd","Segmentlashning asosiy belgilari: geografik joylashuv; yosh, jins va oila kabi demografik ko‘rsatkichla ishtirokisiz yangi marshrutlar ochish","Daromadni oshirish uchun tabiiy resurslarga yuklamani kuchaytirish"],"164":["Sayyohlar oqimini ustuvor qilib, ekologik yuklamani keyin baholash","Narxni pasaytirish hisobiga xavfsizlik xarajatlarini qisqartirish","Foyda marjasini oshirish uchun mahalliy hamkorlikni cheklash"],"168":["Iqtisodiy va ekologik natijalarni o‘lchab, ijtimoiy natijani ajratish","Maksimal sayyohlar oqimini asosiy yagona KPI deb olish","Mahalliy hamkorlikni uzoq muddatli strategiyadan ajratish"],"174":["Qisqa muddatli sotuvni oshirib, natijalarni faqat mavsum oxirida baholash","Sertifikatlarni targ‘ib qilib, mahalliy hamkorlikni reklama bilan almashtirish","Talabni oshirish uchun natija o‘lchovini ijtimoiy tarmoq ko‘rishlariga cheklash"],"181":["Segment hajmi, dizayn jozibasi va reklama qamrovini","Segment o‘sishi, geografik masofa va kontent formatini","Bozor sig‘imi, mahsulot nomi va brend ko‘rinishini"],"182":["Mavjud segmentlarning barchasiga yagona mahsulot taklif qilish","Har bir segment uchun alohida marketing kompleksini qo‘llash","Turli segmentlarni birlashtirib umumiy xabar tarqatish"],"185":["Faqat raqib narxidan arzonroq narxni","Bozor qamrovini maksimal qilish uchun yagona reklama shiorini","Mijoz tadqiqotisiz brendning vizual belgisini"],"189":["Segmentga reklama kanallari orqali yetib borish imkoni","Segmentning boshqa guruhlardan aniq farqlanishi","Segmentga mos marketing dasturini amalga oshirish imkoni"],"191":["Targeting → segmentlash → pozitsiyalash","Pozitsiyalash → targeting → segmentlash","Segmentlash → pozitsiyalash → targeting"],"192":["Segmentatsiya — bozorni turli ehtiyojli guruhlarga ajratish","Pozitsiyalash — brendga mijoz ongida farqli o‘rin berish","Differensiatsiya — xizmatni raqobatchidan farqlash"],"194":["Bozor segmentatsiyasi","Kontent-marketing strategiyasi","Maqsadli bozorni tanlash"],"203":["Faqat reklama ko‘rishlar sonini o‘lchash","Reklama xarajati o‘sishini kampaniya muvaffaqiyati deb bilish","Faqat kampaniya tugagach auditoriya fikrini yig‘ish"],"213":["Omnikanal savdo taqsimoti","Raqamli reklamaning alohida optimallashtirilishi","Faqat ijtimoiy tarmoqlar uchun kontent strategiyasi"],"234":["Mijozlar xohishiga ko‘ra barcha narxni darhol tushirish","Narxni o‘zgartirmasdan reklama byudjetini kengaytirish","Xizmat qiymatini baholamasdan boshqa bozorga o‘tish"]};
const QUESTIONS=RAW.map(r=>({id:r[0],q:r[1],options:r.slice(2,6),correct:'ABCD'.indexOf(r[6]),src:r[7],explain:r[8],status:r[9]}));
const byId=new Map(QUESTIONS.map(q=>[q.id,q]));
function forQuestion(id){const q=byId.get(id);if(active!=='hard'||!HARD_DISTRACTORS[id])return q;const opts=[...q.options],wrong=HARD_DISTRACTORS[id];let n=0;for(let k=0;k<4;k++)if(k!==q.correct)opts[k]=wrong[n++];return {...q,options:opts};}
const KEYS=QUESTIONS.map(q=>q.id);
const DBKEY='marketing158_test_v3';
let db={sessions:{},last:null},active=null,pos=0,view='home',reviewFilter='all';
try{const saved=localStorage.getItem(DBKEY);if(saved){let parsed=JSON.parse(saved);if(parsed&&parsed.sessions)db=parsed;}}catch(e){}
const $=s=>document.querySelector(s),root=$('#root');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function store(){try{localStorage.setItem(DBKEY,JSON.stringify(db));}catch(e){}}
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function shuffled(a,seed){const r=[...a],f=rng(seed);for(let i=r.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function modeIds(key){if(key==='all')return [...KEYS];if(key==='hard')return HARD.filter(id=>byId.has(id));if(key==='random')return shuffled(KEYS,Date.now()).slice(0,25);if(key.startsWith('f50-')){const n=+key.split('-')[1];return KEYS.slice((n-1)*50,n*50);}if(key.startsWith('ticket-')){const n=+key.split('-')[1];return n===7?KEYS.slice(-25):KEYS.slice((n-1)*25,n*25);}return [];}
function modeTitle(key){if(key==='all')return 'Barcha 158 ta test';if(key==='hard')return 'Murakkab 25 ta test';if(key==='random')return 'Tasodifiy 25 ta test';if(key.startsWith('f50-')){const n=+key.split('-')[1];return '50 talik — '+n+'-bo‘lim';}if(key.startsWith('ticket-'))return key.split('-')[1]+'-bilet · 25 savol';return key;}
function seedForQuestion(id){return (((id*2654435761)>>>0)^0x54aeb112)>>>0;}
function choiceOrder(id){return shuffled([0,1,2,3],seedForQuestion(id));}
function getSession(){return active&&db.sessions[active];}
function answeredCount(s){return s.ids.filter(id=>Number.isInteger(s.answers[id])).length;}
function getStatus(s,id){if(!Number.isInteger(s.answers[id]))return 'empty';return s.answers[id]===byId.get(id).correct?'pass':'fail';}
function results(s){let ok=0,bad=0,blank=0;for(const id of s.ids){let st=getStatus(s,id);if(st==='pass')ok++;else if(st==='fail')bad++;else blank++;}return {ok,bad,blank,total:s.ids.length,pct:Math.round(ok/s.ids.length*100)};}
function makeSession(key,newAttempt=false){const ids=modeIds(key);if(!ids.length)return;if(!db.sessions[key]||newAttempt){db.sessions[key]={ids,answers:{},position:0,finished:false,created:Date.now()};}active=key;pos=Math.min(db.sessions[key].position||0,db.sessions[key].ids.length-1);view=db.sessions[key].finished?'results':'quiz';db.last=key;store();render();}
function home(){view='home';render();}
function resume(){if(db.last&&db.sessions[db.last]){active=db.last;view=db.sessions[active].finished?'results':'quiz';pos=db.sessions[active].position||0;render();}else home();}
function render(){if(view==='home')renderHome();else if(view==='quiz')renderQuiz();else renderResults();$('#resumeBtn').style.display=db.last?'inline-block':'none';}
function existing(key){const s=db.sessions[key];if(!s)return '';const n=answeredCount(s);return s.finished?'✓ yakunlangan — '+results(s).pct+'%':n+' / '+s.ids.length+' ishlangan';}
function modeButton(key,label,detail){return `<button data-mode="${key}">${esc(label)}<small>${esc(existing(key)||detail||'Boshlash')}</small></button>`;}
function renderHome(){const totalDone=Object.keys(db.sessions).length;root.innerHTML=`
<div class="hero"><div class="eyebrow">O‘qish · Takrorlash · Sinov</div><h2>Bilimingizni sinab ko‘ring.</h2><p>158 ta prezentatsiyaga bog‘langan testni istalgan tartibda ishlang. Variantlar aralashtiriladi, tanlagan javobingiz darhol tekshiriladi va xatolaringiz yakunda batafsil ko‘rsatiladi.</p><div class="hero-stat"><div><strong>158</strong><span>SAVOL</span></div><div><strong>4</strong><span>JAVOB VARIANTI</span></div><div><strong>7</strong><span>BILET</span></div><div><strong>${totalDone}</strong><span>SAQLANGAN URINISH</span></div></div></div>
<div class="sectionhead"><div><h3>Test formatini tanlang</h3><p>Har birini alohida boshlab, keyin davom ettirishingiz mumkin.</p></div></div>
<div class="modes"><article class="mode"><div class="round-icon">◎</div><h4>Barchasini bittada</h4><p>158 ta savolning hammasini bitta urinishda yeching va umumiy foizingizni biling.</p><button class="primary" data-mode="all">158 ta testni boshlash</button><small class="footnote">${esc(existing('all'))}</small></article><article class="mode"><div class="round-icon">▦</div><h4>Murakkab 25</h4><p>Strategiya, segmentatsiya, tahlil va amaliy vaziyatlar bilan bog‘liq savollardan tanlangan murakkabroq to‘plam.</p><button class="primary" data-mode="hard">Murakkab testni boshlash</button><small class="footnote">${esc(existing('hard'))}</small></article><article class="mode"><div class="round-icon">⤨</div><h4>Tasodifiy 25</h4><p>158 ta test ichidan 25 tasi tanlanadi. Yangi urinishda boshqa savollar ham tushishi mumkin.</p><button class="primary" data-mode="random">25 ta testni boshlash</button><small class="footnote">${esc(existing('random'))}</small></article></div>
<div class="sectionhead"><div><h3>50 talik bo‘limlar</h3><p>Har bir bo‘lim mustaqil baholanadi.</p></div></div><div class="group">${modeButton('f50-1','1–50','50 ta savol')}${modeButton('f50-2','51–100','50 ta savol')}${modeButton('f50-3','101–150','50 ta savol')}${modeButton('f50-4','151–158','Qolgan 8 ta savol')}</div>
<div class="sectionhead"><div><h3>25 talik biletlar</h3><p>Istalgan biletni tanlab, alohida ishlang.</p></div></div><div class="group">${[1,2,3,4,5,6,7].map(i=>modeButton('ticket-'+i,i+'-bilet', '25 ta savol')).join('')}</div>
<div class="footnote">7-bilet ham 25 ta bo‘lishi uchun oxirgi 25 savoldan tuzilgan. Shu sababli uning 17 ta savoli 6-bilet bilan takrorlanadi. <strong>158 talik umumiy testda esa savollar takrorlanmaydi.</strong></div>
<div class="hint"><strong>Qanday ishlaydi?</strong> Javob berganingizda to‘g‘ri variant yashil, noto‘g‘ri tanlov qizil bo‘ladi. Savol raqamlarini bosib avvalgi javoblaringizga qaytishingiz mumkin. Testni istalgan payt yakunlash yoki keyin davom ettirish mumkin. Savollar va asosiy javoblar prezentatsiya bilan bog‘langan manba fayldan olingan.</div>`;
root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>makeSession(b.dataset.mode));}
function renderQuiz(){const s=getSession();if(!s)return home();const id=s.ids[pos],q=forQuestion(id),picked=s.answers[id],answered=Number.isInteger(picked),right=picked===q.correct,ord=choiceOrder(id),count=answeredCount(s),stats=results(s);root.innerHTML=`
<div class="topline"><div><div class="crumb">Bosh sahifa / ${esc(modeTitle(active))}</div><h2 style="margin:2px 0 0;font-size:23px">${esc(modeTitle(active))}</h2></div><span class="pill">${count} / ${s.ids.length} ta javob</span></div>
<div class="quizlayout"><section class="paper"><div class="paperhead"><span class="qnum">${pos+1}-savol / ${s.ids.length}</span><span class="source">${esc(q.src)} · Asl № ${q.id}</span></div><h2 class="question">${esc(q.q)}</h2><div class="options">${ord.map((index,i)=>{const classes=['opt'];if(answered){classes.push('locked');if(index===q.correct)classes.push('correct');else if(index===picked)classes.push('wrong');}return `<button class="${classes.join(' ')}" data-choice="${index}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(q.options[index])}</span>${answered&&index===q.correct?'<span style="margin-left:auto;font-weight:850">✓</span>':''}${answered&&index===picked&&!right?'<span style="margin-left:auto;font-weight:850">✕</span>':''}</button>`;}).join('')}</div>
${answered?`<div class="feedback ${right?'ok':'bad'}"><strong>${right?'✓ To‘g‘ri javob!':'✕ Noto‘g‘ri javob.'}</strong>To‘g‘ri javob: <b>${esc(q.options[q.correct])}</b>${q.explain?`<div class="explain">${esc(q.explain)}</div>`:''}</div>`:'<div class="footnote">Javobni tanlang. Tanlovingiz tekshirilgach, javob shu urinishda saqlanadi.</div>'}
${q.status!=='Tayyor'?`<div class="caution">⚠️ Manbadagi eslatma: ${esc(q.status)} Javob kaliti manba fayldagidek qoldirilgan.</div>`:''}
<div class="qfooter"><button class="outline" id="prev" ${pos===0?'disabled':''}>← Oldingi</button><div class="right"><button class="outline" id="finish">Yakunlash</button><button class="primary" id="next">${pos===s.ids.length-1?'Natijaga →':'Keyingi →'}</button></div></div></section>
<aside class="rail"><div class="railcard"><h3>Jarayon</h3><div class="rowline"><span>Yechilgan savollar</span><strong>${count} / ${s.ids.length}</strong></div><div class="progress"><div style="width:${count/s.ids.length*100}%"></div></div><div class="rowline"><span>To‘g‘ri: <strong style="color:var(--green)">${stats.ok}</strong></span><span>Xato: <strong style="color:var(--red)">${stats.bad}</strong></span></div></div><div class="railcard"><h3>Savollar xaritasi</h3><div class="palette">${s.ids.map((qid,i)=>`<button class="pbutton ${getStatus(s,qid)==='empty'?'':getStatus(s,qid)} ${i===pos?'now':''}" data-pos="${i}" title="${i+1}-savol">${i+1}</button>`).join('')}</div><div class="legend"><span><i class="dot" style="background:var(--green)"></i>To‘g‘ri</span><span><i class="dot" style="background:var(--red)"></i>Xato</span><span><i class="dot" style="background:#c9d0df"></i>Yechilmagan</span></div></div><div class="railcard"><h3>Urinishni boshqarish</h3><p class="footnote" style="margin-top:0">Javoblaringiz shu brauzerda avtomatik saqlanadi.</p><button class="outline smallaction" id="newattempt">↻ Qaytadan boshlash</button><div class="panelbottom"><button class="soft smallaction" id="seeResult">Natijalarimni ko‘rish →</button></div></div></aside></div>`;
root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const s=getSession(),id=s.ids[pos];if(Number.isInteger(s.answers[id]))return;s.answers[id]=+b.dataset.choice;store();renderQuiz();});
root.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>go(+b.dataset.pos));
$('#prev').onclick=()=>go(pos-1);$('#next').onclick=()=>pos+1>=s.ids.length?finishQuiz():go(pos+1);$('#finish').onclick=finishQuiz;$('#seeResult').onclick=finishQuiz;$('#newattempt').onclick=restart;
}
function go(n){const s=getSession();pos=Math.max(0,Math.min(s.ids.length-1,n));s.position=pos;store();renderQuiz();window.scrollTo({top:0,behavior:'smooth'});}
function finishQuiz(){const s=getSession(),left=s.ids.length-answeredCount(s);if(left&&!confirm('Hali '+left+' ta savol yechilmagan. Testni hozir yakunlaysizmi?'))return;s.finished=true;view='results';store();reviewFilter='all';render();window.scrollTo(0,0);}
function restart(){if(!confirm('Ushbu urinishdagi javoblar o‘chadi. Qaytadan boshlaysizmi?'))return;makeSession(active,true);}
function resultRow(q,s,n){const st=getStatus(s,q.id),pick=s.answers[q.id];return `<article class="reviewitem"><div class="reviewtop"><span class="qnum">${n}-savol · Asl № ${q.id}</span><span class="status ${st==='empty'?'miss':st}">${st==='pass'?'✓ To‘g‘ri':st==='fail'?'✕ Xato':'— Javobsiz'}</span></div><h3>${esc(q.q)}</h3>${st==='fail'?`<div class="reviewans bad">Siz tanlagan: ${esc(q.options[pick])}</div>`:''}${st==='pass'?`<div class="reviewans good">Sizning javobingiz: ${esc(q.options[pick])}</div>`:''}${st==='empty'?'<div class="reviewans blank">Javob belgilanmagan</div>':''}<div class="reviewans good">To‘g‘ri javob: ${esc(q.options[q.correct])}</div><div class="reviewdetail">${esc(q.src)}${q.explain?' · '+esc(q.explain):''}</div>${q.status!=='Tayyor'?`<div class="caution">${esc(q.status)}</div>`:''}</article>`;}
function renderResults(){const s=getSession();if(!s)return home();const st=results(s);root.innerHTML=`<div class="topline"><div class="crumb">${esc(modeTitle(active))} / Yakuniy natija</div><div class="group"><button class="outline smallaction" id="backhome">Bosh sahifa</button><button class="outline smallaction" id="retry">Yangi urinish</button></div></div><div class="resultshead"><div class="eyebrow" style="color:#c8c8ff">Test natijasi</div><h2>${esc(modeTitle(active))}</h2><div class="scorebig">${st.pct}<span>%</span></div><div>${st.ok} ta to‘g‘ri javob / ${st.total} ta savol</div></div><div class="stats"><div class="stat"><strong>${st.total}</strong><small>Jami savol</small></div><div class="stat"><strong style="color:var(--green)">${st.ok}</strong><small>To‘g‘ri</small></div><div class="stat"><strong style="color:var(--red)">${st.bad}</strong><small>Noto‘g‘ri</small></div><div class="stat"><strong>${st.blank}</strong><small>Javobsiz</small></div></div><div class="sectionhead"><div><h3>Barcha savollaringizni tekshiring</h3><p>Xato va to‘g‘ri javoblarning barchasi shu yerda ko‘rsatiladi.</p></div></div><div class="toolbar"><button class="filter ${reviewFilter==='all'?'active':''}" data-filter="all">Barchasi (${st.total})</button><button class="filter ${reviewFilter==='fail'?'active':''}" data-filter="fail">Xatolar (${st.bad})</button><button class="filter ${reviewFilter==='pass'?'active':''}" data-filter="pass">To‘g‘ri (${st.ok})</button><button class="filter ${reviewFilter==='empty'?'active':''}" data-filter="empty">Javobsiz (${st.blank})</button><button class="outline smallaction" style="margin-left:auto" id="export">↓ Natijani CSV</button><button class="outline smallaction" id="print">⎙ Chop etish / PDF</button></div><div class="review" id="review"></div>`;
root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.filter;renderResults();});
$('#backhome').onclick=home;$('#retry').onclick=restart;$('#print').onclick=()=>window.print();$('#export').onclick=downloadResults;
const subset=s.ids.map((id,i)=>({q:forQuestion(id),n:i+1})).filter(x=>reviewFilter==='all'||getStatus(s,x.q.id)===reviewFilter);$('#review').innerHTML=subset.length?subset.map(x=>resultRow(x.q,s,x.n)).join(''):'<div class="empty">Bu bo‘limda savollar yo‘q.</div>';
}
function downloadResults(){const s=getSession(),st=results(s);let lines=[['Tartib','Asl ID','Savol','Belgilangan javob','To‘g‘ri javob','Natija','Manba']];s.ids.forEach((id,i)=>{let q=forQuestion(id),p=s.answers[id];lines.push([i+1,id,q.q,Number.isInteger(p)?q.options[p]:'',q.options[q.correct],getStatus(s,id)==='pass'?'To‘g‘ri':getStatus(s,id)==='fail'?'Xato':'Javobsiz',q.src]);});lines.push(['Umumiy foiz',st.pct+'%','','','','','']);const csv='\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='marketing_natija_'+active+'.csv';a.click();URL.revokeObjectURL(url);}
$('#homeBtn').onclick=home;$('#resumeBtn').onclick=resume;
if(db.last&&db.sessions[db.last]){active=db.last;const s=db.sessions[active];pos=s.position||0;view=s.finished?'results':'home';}
render();
</script>
